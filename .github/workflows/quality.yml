name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Validate repository contract
        run: python scripts/check_repository.py --final
      - name: Validate pull-request contract freshness
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: python scripts/check_repository.py --final --base-ref "$BASE_REF"
